appId: com.laboratory.lms
productName: Offline Laboratory Management System
copyright: Copyright © 2026 Medical Laboratory Systems
directories:
  output: dist-installer
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - database/migrations/**/*
  - database/seeds/**/*
  - package.json

asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3-multiple-ciphers/**/*'

extraResources:
  - from: database/migrations
    to: database/migrations
  - from: database/seeds
    to: database/seeds

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Offline Laboratory Management System
  uninstallDisplayName: Offline Laboratory Management System
  deleteAppDataOnUninstall: false
